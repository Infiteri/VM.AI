  - "Quick note: [TASK] costing [COST] is done."
  - "I'll be [TASK] [RECURRENCE] so ping [EMAIL] if needed."
  - "Actually, let's [TASK] for [PROJECT] [DEADLINE]."
  - "Wait, did [CONTACT] say [TASK] is [PRIORITY] priority?"
  - "I'm thinking of [TASK] for [DURATION] at [LOCATION]."
  - "Look, [PERSON] needs [QUANTITY] [TASK] by [TIME]."
  - "Anyway, [TASK] on [DATE] is still happening."
  - "FYI: [TEAM] is [TASK] for [PROJECT] all day."
  - "By the way, check the [TASK] docs [DEADLINE]."
  - "Honestly, [TASK] should take at least [DURATION]."
  - "Can't talk, [TASK] with [CONTACT] until [TIME]."

  # --- NEGATIVE COMMANDS & CONSTRAINTS ---
