  # --- CONDITIONAL & DEPENDENT TASKS (IF/WHEN) ---
  - "If [PERSON] calls, [TASK] for [DURATION] immediately."
  - "Unless [TASK] is [PRIORITY], wait until [DEADLINE]."
  - "Once [TASK] is finished, send [QUANTITY] docs to [CONTACT]."
  - "After the [MEETING] at [LOCATION], please [TASK]."
  - "When [DATE] arrives, ensure [TASK] is [PRIORITY]."
  - "If [COST] exceeds budget, stop [TASK] for [PROJECT]."
  - "While [TASK] is in progress, email [EMAIL] updates."
  - "Before [TIME], [TASK] must be submitted to [PERSON]."
  - "As soon as [TASK] is done, book [MEETING] with [TEAM]."
  - "If [LOCATION] is closed, [TASK] from home [DEADLINE]."
  - "Provided [CONTACT] agrees, [TASK] for [DURATION]."
  - "Assuming [PROJECT] is on track, [TASK] [RECURRENCE]."
  - "In case of delay, [TASK] becomes [PRIORITY] priority."
  - "If [QUANTITY] is low, order [TASK] from [LOCATION]."
  - "Unless [PERSON] objects, [TASK] at [TIME] on [DATE]."

  # --- PASSIVE VOICE & FORMAL OBSERVATIONS ---
  - "[TASK] is required to be completed by [DEADLINE]."
  - "The [MEETING] was scheduled with [PERSON] for [TIME]."
  - "[QUANTITY] units of [TASK] were ordered for [PROJECT]."
  - "[LOCATION] has been designated for the [TASK] site."
  - "[PRIORITY] status was assigned to [TASK] by [CONTACT]."
  - "Updates for [TASK] are being sent to [EMAIL]."
  - "A [DURATION] window has been blocked for [MEETING]."
  - "[PROJECT] milestones are to be reviewed [RECURRENCE]."
  - "[TASK] was performed by [TEAM] for [DURATION]."
  - "[COST] was quoted for [TASK] by [PERSON] on [DATE]."
  - "Final [TASK] results should be sent to [CONTACT]."
  - "[LOCATION] needs to be prepared for [MEETING]."
  - "The [TASK] for [PROJECT] is expected by [TIME]."
  - "[RECURRENCE] meetings are held with [TEAM] at [LOCATION]."
  - "[QUANTITY] reports for [TASK] are due [DEADLINE]."

  # --- CONVERSATIONAL & "BUSY" PATTERNS ---
  - "Hey, I'm tied up with [TASK] for [DURATION] right now."
