# ─── MODIFY: targeted boolean and time change examples ────────────────────────

- input: 'modify: {"name": "gym", "fixed_time": true, "fixed_start": "06:00"} │ move to 7am'
  output:
    fixed_time: true
    fixed_start: "07:00"

- input: 'modify: {"name": "gym", "fixed_time": true, "fixed_start": "06:00"} │ at 8am instead'
  output:
    fixed_time: true
    fixed_start: "08:00"

- input: 'modify: {"name": "meeting", "fixed_time": true, "fixed_start": "14:00"} │ move to 3pm'
  output:
    fixed_time: true
    fixed_start: "15:00"

- input: 'modify: {"name": "team meeting", "fixed_time": true, "fixed_start": "15:00"} │ cancel fixed time'
  output:
    fixed_time: false
    fixed_start: null

- input: 'modify: {"name": "gym", "recurrent": true, "recurrence_days": ["Monday", "Wednesday"]} │ change to Tuesday and Thursday'
  output:
    recurrent: true
    recurrence_days:
    - Tuesday
    - Thursday

- input: 'modify: {"name": "standup", "fixed_time": true, "fixed_start": "09:00"} │ move to 9:30am'
  output:
    fixed_time: true
    fixed_start: "09:30"

- input: 'modify: {"name": "yoga class", "fixed_time": true, "fixed_start": "08:00"} │ push to 10am'
  output:
    fixed_time: true
    fixed_start: "10:00"

- input: 'modify: {"name": "dentist", "fixed_time": true, "fixed_start": "14:00"} │ change to 3pm'
  output:
    fixed_time: true
    fixed_start: "15:00"

- input: 'modify: {"name": "call", "fixed_time": true, "fixed_start": "15:00"} │ cancel fixed time'
  output:
    fixed_time: false
    fixed_start: null

- input: 'modify: {"name": "meditate", "recurrent": true, "recurrence_days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]} │ change to weekday only'
  output:
    recurrent: true
    recurrence_days:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday

- input: 'modify: {"name": "report", "difficulty": 0.5} │ make it harder'
  output:
    difficulty: 0.8

- input: 'modify: {"name": "workout", "difficulty": 0.3} │ make it more difficult'
  output:
    difficulty: 0.7

- input: 'modify: {"name": "task", "importance": 0.3} │ make it urgent'
  output:
    importance: 0.9

- input: 'modify: {"name": "review", "importance": 0.8} │ lower priority'
  output:
    importance: 0.3

- input: 'modify: {"name": "project", "duration": 60} │ make it 2 hours'
  output:
    duration: 120

- input: 'modify: {"name": "meeting", "duration": 30} │ change to 45 minutes'
  output:
    duration: 45

- input: 'modify: {"name": "gym", "location": "home"} │ move to the office'
  output:
    location: office

- input: 'modify: {"name": "study", "location": "library"} │ do it at home'
  output:
    location: home

- input: 'modify: {"name": "report", "deadline": "Friday"} │ push to next Monday'
  output:
    deadline: next Monday

- input: 'modify: {"name": "assignment", "deadline": "tomorrow"} │ extend to next week'
