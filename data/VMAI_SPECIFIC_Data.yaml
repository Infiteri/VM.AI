# VM.AI Specific Training Data
# Targeted examples to fix model issues:
# - Boolean corruption (falsity/falser -> false)
# - fixed_start normalization (6am -> 06:00)
# - Recurrence day parsing
# - Predicted field inference (difficulty, importance, category)

examples:
