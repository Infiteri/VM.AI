# ─── MODIFY: change recurrence days ─────────────────────────────────────────
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": true, "recurrence_days": ["Monday"]} │
    change to every Tuesday'
  output:
    recurrence_days:
    - Tuesday
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": true, "recurrence_days": ["Monday", "Wednesday"]}
    │ change to every Tuesday and Thursday'
  output:
    recurrence_days:
    - Tuesday
    - Thursday
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": true, "recurrence_days": ["Monday", "Wednesday",
    "Friday"]} │ change to every weekday'
  output:
    recurrence_days:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday

# ─── MODIFY: change time + recurrence together ───────────────────────────────
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": false} │ every Monday at 7 am'
  output:
    fixed_start: '07:00'
    recurrent: true
    recurrence_days:
    - Monday
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": false} │ every weekday at 9 am'
  output:
    fixed_start: '09:00'
    recurrent: true
    recurrence_days:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": false} │ every Tuesday and Thursday at 8 am'
  output:
    fixed_start: '08:00'
    recurrent: true
    recurrence_days:
    - Tuesday
    - Thursday

# ─── MODIFY: stop recurring ──────────────────────────────────────────────────
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": true, "recurrence_days": ["Monday", "Wednesday"]}
    │ not recurring anymore'
  output:
    recurrent: false
    recurrence_days: null
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": true, "recurrence_days": ["Monday"]} │
    remove recurrence'
  output:
    recurrent: false
    recurrence_days: null