# ─── MODIFY: change time ─────────────────────────────────────────────────────
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "05:00", "recurrent": false} │ change to 8 am'
  output:
    fixed_start: '08:00'
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
    "fixed_start": "08:00", "recurrent": false} │ change to 7 am'
  output:
    fixed_start: '07:00'
- input: 'modify: {"name": "go to school", "location": "school", "fixed_time": true,
